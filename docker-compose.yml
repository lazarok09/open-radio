services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openradio
      POSTGRES_PASSWORD: openradio_dev
      POSTGRES_DB: open_radio
    ports:
      - "5432:5432"
    volumes:
      - open-radio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openradio -d open_radio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  open-radio-postgres:
